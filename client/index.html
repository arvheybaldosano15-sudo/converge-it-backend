<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <script>
      (function() {
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.deferredPwaPrompt = e;
        });
        var ua = navigator.userAgent || '';
        var isAndroid = /android/i.test(ua);
        var isChrome = /chrome|crios/i.test(ua) && !/samsungbrowser|ucbrowser|opera|opr|edge|edg/i.test(ua);
        var isInApp = /FBAN|FBAV|Instagram|Line|Twitter|MicroMessenger/i.test(ua);
        if (isAndroid && (isInApp || !isChrome)) {
          if (!window.location.hash.includes('no-intent')) {
            var intentUrl = 'intent://' + window.location.host + window.location.pathname + window.location.search + '#Intent;scheme=https;package=com.android.chrome;end;';
            window.location.href = intentUrl;
          }
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Converge IT" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Converge IT Solutions — Mobile Ticketing System</title>
  </head>
  <body class="bg-[#0f172a] text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
